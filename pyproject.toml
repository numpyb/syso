[project]
name = "syso"
version = "0.1.0"
description = "Bootable ISO workbench: probe, extract, edit, and repack bootable ISOs."
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
syso = "syso.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["syso", "syso.backend", "syso.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]